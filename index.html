<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI-G Pro | Global Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <style>
        :root {
            --primary-color: #00ff88;
            --accent-color: #00d4ff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --danger-color: #ff0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .omni-card {
            width: 100%;
            max-width: 600px; /* Tamaño optimizado para lectura */
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid #333;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-top: 10px;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.8rem; letter-spacing: 3px; color: var(--primary-color); text-transform: uppercase; }
        .header p { color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; letter-spacing: 1px; }

        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.75rem; color: var(--primary-color); text-transform: uppercase; }

        textarea {
            width: 100%; height: 160px; background: #000; border: 1px solid #444; border-radius: 12px;
            padding: 15px; color: var(--primary-color); font-family: 'Courier New', monospace; font-size: 0.95rem; outline: none;
            resize: vertical;
        }

        /* Contenedor Responsivo */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .timezone-block { 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 15px; 
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,255,136,0.15);
        }
        .timezone-title { font-size: 0.9rem; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; color: #000; }
        
        select#timezoneSelect {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem;
            background: #f8f8f8; color: #000; font-weight: bold; appearance: none;
        }

        .button-group { display: flex; flex-direction: column; gap: 10px; }

        .btn { 
            padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; 
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; border: none; width: 100%; 
        }
        .btn-main { background: var(--primary-color); color: #000; box-shadow: 0 4px 0px #00a85a; }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0px #00a85a; }
        
        .btn-clear { background: var(--danger-color); color: #fff; display: none; padding: 12px; font-size: 0.85rem; }

        .result-box { background: #000; border: 1px dashed #444; padding: 18px; border-radius: 12px; margin-top: 15px; min-height: 60px; }
        #output { white-space: pre-wrap; color: var(--accent-color); font-family: 'Courier New', monospace; font-size: 1rem; line-height: 1.6; }

        .copy-btn { margin-top: 15px; background: transparent; color: var(--accent-color); border: 1.5px solid var(--accent-color); display: none; }
        .copy-btn:active { background: rgba(0, 212, 255, 0.1); }
        
        .footer-note { text-align: center; margin-top: 30px; font-size: 0.65rem; color: #555; letter-spacing: 2px; text-transform: uppercase; }

        /* Media Queries para Tablets y Desktop */
        @media (min-width: 481px) {
            .controls-wrapper { flex-direction: row; align-items: stretch; }
            .timezone-block { flex: 1; }
            .button-group { width: 220px; justify-content: space-between; }
            .header h1 { font-size: 2.2rem; }
            .omni-card { padding: 35px; }
        }
    </style>
</head>
<body>

<div class="omni-card">
    <div class="header">
        <h1>OMNI-G Pro</h1>
        <p>Signal Optimization Engine</p>
    </div>

    <label>Entrada de Señales (UTC-3)</label>
    <textarea id="rawInput" placeholder="Pega tus señales aquí..."></textarea>

    <div class="controls-wrapper">
        <div class="timezone-block">
            <div class="timezone-title">Zona Horaria</div>
            <select id="timezoneSelect"></select>
            <div style="margin-top:10px; font-size:0.8rem;">Hora Local: <span id="clockDisplay" style="font-weight:900;">--:--:--</span></div>
        </div>
        
        <div class="button-group">
            <button class="btn btn-main" onclick="processSignals()">Convertir</button>
            <button id="clearBtn" class="btn btn-clear" onclick="clearAll()">Borrar Todo</button>
        </div>
    </div>

    <div class="result-box">
        <div id="output">Esperando señales...</div>
    </div>
    
    <button id="copyBtn" class="btn copy-btn" onclick="copyResult()">Copiar Resultado</button>

    <p class="footer-note">OMNI-G Pro Trading Tools | 2026</p>
</div>

<script>
    function initialize() {
        const select = document.getElementById('timezoneSelect');
        const clock = document.getElementById('clockDisplay');
        const zones = moment.tz.names();
        const userZone = "America/Guayaquil"; // Preselección para Ecuador

        select.innerHTML = "";
        zones.forEach(zone => {
            if (!zone.includes('/') || zone.startsWith('Etc/')) return;
            const opt = document.createElement('option');
            opt.value = zone;
            opt.text = `${zone.split('/').pop().replace('_',' ')} (${moment.tz(zone).format('Z')})`;
            if (zone === userZone) opt.selected = true;
            select.appendChild(opt);
        });

        function updateClock() {
            const selectedZone = select.value;
            if (selectedZone) {
                clock.innerText = moment().tz(selectedZone).format('HH:mm:ss');
            }
        }
        
        select.addEventListener('change', updateClock);
        setInterval(updateClock, 1000);
        updateClock();
    }

    window.onload = initialize;

    function clearAll() {
        document.getElementById('rawInput').value = "";
        document.getElementById('output').innerText = "Esperando señales...";
        document.getElementById('copyBtn').style.display = 'none';
        document.getElementById('clearBtn').style.display = 'none';
    }

    function processSignals() {
        const input = document.getElementById('rawInput').value;
        const targetZone = document.getElementById('timezoneSelect').value;
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        const lines = input.split('\n');
        let processed = [];

        lines.forEach(line => {
            if (!line.trim()) return;

            let timeMatch = line.match(/(\d{1,2}:\d{2})/);
            let assetMatch = line.match(/[A-Z]{3,}(?:-[A-Z]+)?/);
            let dirMatch = line.match(/CALL|PUT|BUY|SELL/i);

            if (timeMatch && assetMatch && dirMatch) {
                let asset = assetMatch[0].toUpperCase();
                let time = timeMatch[0];
                let dir = dirMatch[0].toUpperCase().replace('BUY', 'CALL').replace('SELL', 'PUT');

                let [h, m] = time.split(':').map(Number);
                let signalDate = moment.tz({hour: h, minute: m}, "America/Argentina/Buenos_Aires");
                let converted = signalDate.clone().tz(targetZone);
                
                processed.push(`${asset} - ${converted.format('HH:mm')} - ${dir} - 1M`);
            }
        });

        if (processed.length > 0) {
            output.innerText = processed.join('\n');
            copyBtn.style.display = 'block';
            clearBtn.style.display = 'block';
        } else {
            output.innerText = "Error: Formato no válido.";
            copyBtn.style.display = 'none';
            clearBtn.style.display = 'none';
        }
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "¡Copiado!";
            setTimeout(() => btn.innerText = "Copiar Resultado", 2000);
        });
    }
</script>

</body>
</html>
