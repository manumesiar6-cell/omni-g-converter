<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-G Pro | Global Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <style>
        :root {
            --primary-color: #00ff88;
            --accent-color: #00d4ff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .omni-card {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #333;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; letter-spacing: 4px; color: var(--primary-color); text-transform: uppercase; }
        .header p { color: var(--text-dim); font-size: 0.9rem; margin-top: 5px; }

        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.85rem; color: var(--primary-color); text-transform: uppercase; }

        textarea {
            width: 100%; height: 180px; background: #000; border: 1px solid #444; border-radius: 8px;
            padding: 15px; color: var(--primary-color); font-family: monospace; font-size: 0.9rem; outline: none;
        }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; align-items: center; }

        /* Estilo de la cajita de Horario manteniendo el look OMNI */
        .timezone-block { 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 12px; 
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }
        .timezone-title { font-size: 1rem; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; color: #000; }
        
        select#timezoneSelect {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.9rem;
            background: #fff; color: #333; font-weight: bold;
        }

        .btn { padding: 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; border: none; }
        .btn-main { background: var(--primary-color); color: #000; }
        .btn-main:hover { background: #00cc6e; transform: scale(1.02); }

        .result-box { background: #000; border: 1px dashed #444; padding: 20px; border-radius: 8px; margin-top: 20px; min-height: 80px; }
        #output { white-space: pre-wrap; color: var(--accent-color); font-family: monospace; font-size: 1.1rem; line-height: 1.5; }

        .copy-btn { margin-top: 15px; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); width: 100%; }
        .copy-btn:hover { background: var(--accent-color); color: #000; }
        
        .footer-note { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #444; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="omni-card">
    <div class="header">
        <h1>OMNI-G Pro</h1>
        <p>Global Signal Optimization Engine</p>
    </div>

    <label>Listado de Señales Originales (FORMAT UTC-3)</label>
    <textarea id="rawInput" placeholder="Pega aquí tus señales..."></textarea>

    <div class="settings-grid">
        <div class="timezone-block">
            <div class="timezone-title">Elegí tu zona horaria</div>
            <select id="timezoneSelect"></select>
            <div style="margin-top:8px; font-size:0.85rem;">Hora Actual: <span id="clockDisplay" style="font-weight:bold;">00:00:00</span></div>
        </div>
        <button class="btn btn-main" onclick="processSignals()">Convertir Ahora</button>
    </div>

    <div class="result-box">
        <div id="output">Esperando señales...</div>
    </div>
    
    <button id="copyBtn" class="btn copy-btn" onclick="copyResult()">Copiar al Portapapeles</button>

    <p class="footer-note">OMNI-G Pro Trading Tools | 2026</p>
</div>

<script>
    function initialize() {
        const select = document.getElementById('timezoneSelect');
        const clock = document.getElementById('clockDisplay');
        const zones = moment.tz.names();
        const userZone = moment.tz.guess();

        zones.forEach(zone => {
            if (!zone.includes('/') || zone.startsWith('Etc/')) return;
            const opt = document.createElement('option');
            opt.value = zone;
            opt.text = `${zone} (${moment.tz(zone).format('Z')})`;
            if (zone === userZone) opt.selected = true;
            select.appendChild(opt);
        });

        function updateClock() {
            clock.innerText = moment().tz(select.value).format('HH:mm:ss');
        }
        select.addEventListener('change', updateClock);
        setInterval(updateClock, 1000);
        updateClock();
    }

    window.onload = initialize;

    function processSignals() {
        const input = document.getElementById('rawInput').value;
        const targetZone = document.getElementById('timezoneSelect').value;
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        
        const lines = input.split('\n');
        let processed = [];

        lines.forEach(line => {
            if (!line.trim()) return;

            // Buscamos la hora (formato HH:mm)
            let timeMatch = line.match(/(\d{1,2}:\d{2})/);
            // Buscamos el activo (cualquier palabra que tenga letras mayúsculas y posiblemente guiones como -OTC)
            let assetMatch = line.match(/[A-Z]{3,}(?:-[A-Z]+)?/);
            // Buscamos la dirección
            let dirMatch = line.match(/CALL|PUT|BUY|SELL/i);

            if (timeMatch && assetMatch && dirMatch) {
                let asset = assetMatch[0].toUpperCase();
                let time = timeMatch[0];
                let dir = dirMatch[0].toUpperCase().replace('BUY', 'CALL').replace('SELL', 'PUT');

                let [h, m] = time.split(':').map(Number);
                
                // Creamos la fecha en UTC-3 (Argentina)
                let signalDate = moment.tz({hour: h, minute: m}, "America/Argentina/Buenos_Aires");
                
                // Convertimos a la zona detectada (ej: Ecuador UTC-5)
                let converted = signalDate.clone().tz(targetZone);
                
                let finalTime = converted.format('HH:mm');

                processed.push(`${asset} - ${finalTime} - ${dir} - 5MIN`);
            }
        });

        if (processed.length > 0) {
            output.innerText = processed.join('\n');
            copyBtn.style.display = 'block';
        } else {
            output.innerText = "Error: Formato no reconocido. Asegúrate de que cada línea tenga par, hora y dirección.";
            copyBtn.style.display = 'none';
        }
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "¡Copiado con éxito!";
            setTimeout(() => btn.innerText = "Copiar al Portapapeles", 2000);
        });
    }
</script>

</body>
</html>
