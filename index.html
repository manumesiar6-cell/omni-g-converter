<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-G Pro | Central de Conversión Global</title>
    <style>
        :root {
            --primary-color: #00ff88;
            --accent-color: #00d4ff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .omni-card {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #333;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; letter-spacing: 4px; color: var(--primary-color); text-transform: uppercase; }
        .header p { color: var(--text-dim); font-size: 0.9rem; margin-top: 5px; }

        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.85rem; color: var(--primary-color); text-transform: uppercase; }

        textarea {
            width: 100%; height: 180px; background: #000; border: 1px solid #444; border-radius: 8px;
            padding: 15px; color: var(--primary-color); font-family: monospace; font-size: 0.9rem; outline: none;
        }

        .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }

        select, .btn { padding: 14px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: 0.3s; }
        select { background: #222; color: white; border: 1px solid #444; width: 100%; }

        .btn-main { background: var(--primary-color); color: #000; border: none; text-transform: uppercase; }
        .btn-main:hover { background: #00cc6e; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

        .result-box { background: #000; border: 1px dashed #444; padding: 20px; border-radius: 8px; position: relative; margin-top: 20px; }
        #output { white-space: pre-wrap; color: var(--accent-color); font-family: monospace; min-height: 40px; }

        .copy-btn { margin-top: 15px; width: 100%; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); display: none; }
        .copy-btn:hover { background: var(--accent-color); color: #000; }
        
        .footer-note { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #555; }
    </style>
</head>
<body onload="detectTimezone()">

<div class="omni-card">
    <div class="header">
        <h1>OMNI-G Pro</h1>
        <p>Global Signal Optimization Engine</p>
    </div>

    <label>Listado de Señales Originales</label>
    <textarea id="rawInput" placeholder="Pega aquí tus señales..."></textarea>

    <div class="settings">
        <div>
            <label>Zona Horaria Detectada</label>
            <select id="timeOffset">
                </select>
        </div>
        <div style="display: flex; align-items: flex-end;">
            <button class="btn btn-main" style="width: 100%;" onclick="processSignals()">Convertir Ahora</button>
        </div>
    </div>

    <div class="result-box">
        <label style="position: absolute; top: -10px; left: 10px; background: var(--card-bg); padding: 0 5px;">Output Optimizado</label>
        <div id="output">Esperando entrada de datos...</div>
    </div>
    
    <button id="copyBtn" class="btn copy-btn" onclick="copyResult()">Copiar al Portapapeles</button>

    <p class="footer-note">OMNI-G Pro Trading Tools | 2026</p>
</div>

<script>
    // 1. Generar todos los horarios y detectar el local
    function detectTimezone() {
        const select = document.getElementById('timeOffset');
        const userOffset = -(new Date().getTimezoneOffset() / 60); // Detecta GMT actual

        for (let i = -12; i <= 14; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            const label = i >= 0 ? `GMT +${i}` : `GMT ${i}`;
            opt.text = label;
            if (i === userOffset) opt.selected = true; // Auto-selección
            select.appendChild(opt);
        }
    }

    function processSignals() {
        const input = document.getElementById('rawInput').value;
        const offset = parseInt(document.getElementById('timeOffset').value);
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        
        const lines = input.split('\n');
        let processed = [];

        lines.forEach(line => {
            if (!line.trim()) return;
            let clean = line.replace(/[^\w\s:;-]/gi, ' ').trim();
            let parts = clean.split(/\s+|;/).filter(p => p.length > 0);

            if (parts.length >= 3) {
                let asset = parts[0].toUpperCase();
                let time = parts.find(p => p.includes(':'));
                let dir = parts.find(p => /CALL|PUT|BUY|SELL/i.test(p));

                if (asset && time && dir) {
                    dir = dir.toUpperCase().replace('BUY', 'CALL').replace('SELL', 'PUT');
                    let [h, m] = time.split(':').map(Number);
                    if (!isNaN(h)) {
                        // El cálculo asume que la señal viene en GMT 0 o se ajusta a la diferencia elegida
                        h = (h + offset + 24) % 24;
                        let finalTime = String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0');
                        processed.push(`${asset};${finalTime};${dir};5min`);
                    }
                }
            }
        });

        if (processed.length > 0) {
            output.innerText = processed.join('\n');
            copyBtn.style.display = 'block';
        } else {
            output.innerText = "No se detectó un formato compatible.";
            copyBtn.style.display = 'none';
        }
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "¡Copiado con éxito!";
            setTimeout(() => btn.innerText = "Copiar al Portapapeles", 2000);
        });
    }
</script>

</body>
</html>
