<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-G Pro | Central de Conversión Global</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>
    <style>
        :root {
            --primary-color: #00ff88;
            --accent-color: #00d4ff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --shadow-card: 0 20px 50px rgba(0,0,0,0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5; /* Fondo claro para que resalte la tarjeta OMNI */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* La tarjeta OMNI mantiene su estilo oscuro Pro */
        .omni-card {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #333;
            padding: 40px;
            box-shadow: var(--shadow-card);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; letter-spacing: 4px; color: var(--primary-color); text-transform: uppercase; margin-bottom: 5px; }
        .header p { color: var(--text-dim); font-size: 0.9rem; }

        label { display: block; margin-bottom: 10px; font-weight: 600; font-size: 0.85rem; color: var(--primary-color); text-transform: uppercase; }

        textarea {
            width: 100%; height: 180px; background: #000; border: 1px solid #444; border-radius: 8px;
            padding: 15px; color: var(--primary-color); font-family: 'Fira Code', monospace; font-size: 0.9rem; outline: none; transition: border 0.3s;
        }
        textarea:focus { border-color: var(--primary-color); }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }

        /* Estilo para el selector de zona horaria, inspirado en tu ejemplo */
        .timezone-block {
            background: #fff; /* Fondo blanco para la cajita de hora */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }

        .timezone-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select#timezoneSelect {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            color: #333;
            background-color: #fff;
            appearance: none; /* Quita la flecha nativa */
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 12px auto;
        }

        .current-time-display {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
        .current-time-display strong { color: #000; font-size: 1rem; }

        .btn { padding: 14px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; }
        .btn-main { background: var(--primary-color); color: #000; border: none; width: 100%; }
        .btn-main:hover { background: #00cc6e; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

        .result-box { background: #000; border: 1px dashed #444; padding: 20px; border-radius: 8px; position: relative; margin-top: 30px; }
        #output { white-space: pre-wrap; color: var(--accent-color); font-family: monospace; min-height: 40px; font-size: 0.9rem; }

        .copy-btn { margin-top: 15px; width: 100%; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); display: none; }
        .copy-btn:hover { background: var(--accent-color); color: #000; }
        
        .footer-note { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #555; }
    </style>
</head>
<body>

<div class="omni-card">
    <div class="header">
        <h1>OMNI-G Pro</h1>
        <p>Global Signal Optimization Engine</p>
    </div>

    <div class="input-group">
        <label>Listado de Señales Originales</label>
        <textarea id="rawInput" placeholder="Pega aquí tus señales... (ej: EURUSD 15:30 CALL 5M)"></textarea>
    </div>

    <div class="settings-grid">
        <div class="timezone-block">
            <div class="timezone-title">Elegí tu zona horaria</div>
            <select id="timezoneSelect">
                </select>
            <div class="current-time-display">
                Tu horario actual es: <strong id="clockDisplay">--:--:--</strong>
            </div>
        </div>

        <div style="display: flex; align-items: flex-end;">
            <button class="btn btn-main" onclick="processSignals()">Convertir Ahora</button>
        </div>
    </div>

    <div class="result-box">
        <label style="position: absolute; top: -10px; left: 10px; background: var(--card-bg); padding: 0 5px; color: var(--primary-color); font-size: 0.8rem;">Output Optimizado (OMNI-Format)</label>
        <div id="output">Esperando entrada de datos...</div>
    </div>
    
    <button id="copyBtn" class="btn copy-btn" onclick="copyResult()">Copiar al Portapapeles</button>

    <p class="footer-note">OMNI-G Pro Trading Tools | © 2026</p>
</div>

<script>
    // 1. Inicializar zonas horarias y reloj
    function initializeTimeSettings() {
        const select = document.getElementById('timezoneSelect');
        const clock = document.getElementById('clockDisplay');
        const zones = moment.tz.names(); // Obtiene todas las zonas horarias
        const userZone = moment.tz.guess(); // Detecta la zona del usuario

        // Llenar el selector
        zones.forEach(zone => {
            // Filtrar zonas poco comunes para limpieza
            if (!zone.includes('/') || zone.startsWith('Etc/') || zone.startsWith('Antarctica/')) return;

            const opt = document.createElement('option');
            opt.value = zone;
            // Formato: Nombre (Offset GMT)
            const offset = moment.tz(zone).format('Z');
            opt.text = `${zone} (${offset})`;
            if (zone === userZone) opt.selected = true;
            select.appendChild(opt);
        });

        // Función del reloj
        function updateClock() {
            const selectedZone = select.value;
            clock.innerText = moment().tz(selectedZone).format('HH:mm:ss');
        }

        // Actualizar reloj al cambiar zona y cada segundo
        select.addEventListener('change', updateClock);
        setInterval(updateClock, 1000);
        updateClock(); // Carga inicial
    }

    // Iniciar al cargar la página
    window.onload = initializeTimeSettings;

    // Lógica de conversión de señales
    function processSignals() {
        const input = document.getElementById('rawInput').value;
        const selectedZone = document.getElementById('timezoneSelect').value;
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        
        const lines = input.split('\n');
        let processed = [];

        lines.forEach(line => {
            if (!line.trim()) return;
            let clean = line.replace(/[^\w\s:;-]/gi, ' ').trim();
            let parts = clean.split(/\s+|;/).filter(p => p.length > 0);

            if (parts.length >= 3) {
                let asset = parts[0].toUpperCase();
                let time = parts.find(p => p.includes(':'));
                let dir = parts.find(p => /CALL|PUT|BUY|SELL/i.test(p));

                if (asset && time && dir) {
                    dir = dir.toUpperCase().replace('BUY', 'CALL').replace('SELL', 'PUT');
                    let [h, m] = time.split(':').map(Number);
                    if (!isNaN(h)) {
                        // Crear la hora original asumiendo que es en la zona SELECCIONADA
                        let originalTime = moment.tz({hour: h, minute: m}, selectedZone);
                        
                        // Convertir la hora original (por ejemplo, si la señal era de un bot en Europa y el usuario eligió Guayaquil, esta es la hora correcta en Guayaquil)
                        let finalTime = originalTime.format('HH:mm');
                        
                        processed.push(`${asset};${finalTime};${dir};5min`);
                    }
                }
            }
        });

        if (processed.length > 0) {
            output.innerText = processed.join('\n');
            copyBtn.style.display = 'block';
        } else {
            output.innerText = "No se detectó un formato compatible.";
            copyBtn.style.display = 'none';
        }
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "¡Copiado con éxito!";
            setTimeout(() => btn.innerText = "Copiar al Portapapeles", 2000);
        });
    }
</script>

</body>
</html>
